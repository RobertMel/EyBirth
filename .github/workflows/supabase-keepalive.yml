name: Supabase Keep-Alive

# Ping la base Supabase tous les 3 jours pour éviter la pause automatique
# après 7 jours d'inactivité (limite du plan gratuit).
on:
  schedule:
    - cron: "0 9 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the guests table
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/guests?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}")
          echo "Réponse Supabase : HTTP $response"
          if [ "$response" -ge 400 ]; then
            echo "::error::Le ping Supabase a échoué (HTTP $response)"
            exit 1
          fi
